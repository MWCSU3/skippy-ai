<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKIPPY // ELDER AI INTERFACE</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --primary: #00ff88;
  --primary-dim: #00aa5580;
  --secondary: #00ccff;
  --warning: #ffaa00;
  --danger: #ff3355;
  --bg-deep: #020810;
  --bg-panel: #0a1628;
  --bg-elevated: #0f1f3a;
  --border: #1a3355;
  --border-glow: #00ff8833;
  --text: #c0e8ff;
  --text-dim: #5588aa;
  --scanline: rgba(0,255,136,0.03);
}

@keyframes scanline {
  0% { transform: translateY(-100%); }
  100% { transform: translateY(100vh); }
}
@keyframes flicker {
  0%, 100% { opacity: 1; }
  92% { opacity: 1; }
  93% { opacity: 0.8; }
  94% { opacity: 1; }
}
@keyframes glow-pulse {
  0%, 100% { box-shadow: 0 0 5px var(--primary-dim), inset 0 0 5px rgba(0,255,136,0.05); }
  50% { box-shadow: 0 0 15px var(--primary-dim), inset 0 0 10px rgba(0,255,136,0.08); }
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes typewriter {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes data-stream {
  0% { background-position: 0% 0%; }
  100% { background-position: 0% 100%; }
}
@keyframes border-flow {
  0% { border-color: var(--border); }
  50% { border-color: var(--primary-dim); }
  100% { border-color: var(--border); }
}

body {
  font-family: 'Courier New', 'Fira Code', monospace;
  background: var(--bg-deep);
  color: var(--primary);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
  animation: flicker 8s infinite;
}

/* Scanline overlay */
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    var(--scanline) 2px,
    var(--scanline) 4px
  );
  pointer-events: none;
  z-index: 9999;
}

/* Moving scanline */
body::after {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 100px;
  background: linear-gradient(to bottom, transparent, rgba(0,255,136,0.03), transparent);
  animation: scanline 6s linear infinite;
  pointer-events: none;
  z-index: 9998;
}

/* Header - Command Interface */
.header {
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border);
  padding: 10px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: relative;
  overflow: hidden;
}

.header::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--primary), transparent);
}

.header-left { display: flex; align-items: center; gap: 15px; }

.logo {
  font-size: 1.1em;
  font-weight: bold;
  color: var(--primary);
  text-shadow: 0 0 10px var(--primary-dim);
  letter-spacing: 3px;
}

.logo-sub {
  font-size: 0.6em;
  color: var(--text-dim);
  letter-spacing: 1px;
  margin-top: 2px;
}

.header-stats {
  display: flex;
  gap: 12px;
  font-size: 0.7em;
}

.stat-item {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  padding: 4px 10px;
  border-radius: 2px;
  color: var(--text);
  font-family: inherit;
}

.stat-item .stat-label { color: var(--text-dim); }
.stat-item .stat-value { color: var(--secondary); font-weight: bold; }

.controls {
  display: flex;
  gap: 6px;
  align-items: center;
}

.ctrl-btn {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 5px 10px;
  font-family: inherit;
  font-size: 0.7em;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.ctrl-btn:hover { border-color: var(--secondary); color: var(--secondary); }
.ctrl-btn.active { border-color: var(--primary); color: var(--primary); background: rgba(0,255,136,0.05); box-shadow: 0 0 8px var(--primary-dim); }

#voice-select {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 4px 8px;
  font-family: inherit;
  font-size: 0.65em;
  max-width: 120px;
  outline: none;
}

/* Chat Area */
.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  background: 
    radial-gradient(ellipse at center, rgba(0,50,30,0.1) 0%, transparent 70%),
    var(--bg-deep);
}

.message {
  max-width: 85%;
  padding: 12px 16px;
  border-radius: 2px;
  line-height: 1.6;
  font-size: 0.85em;
  animation: fadeIn 0.3s ease;
  white-space: pre-wrap;
  position: relative;
}

.message.user {
  align-self: flex-end;
  background: var(--bg-elevated);
  color: var(--secondary);
  border: 1px solid rgba(0,204,255,0.3);
  border-left: 3px solid var(--secondary);
}

.message.user::before {
  content: '> USER';
  position: absolute;
  top: -8px;
  right: 10px;
  font-size: 0.6em;
  color: var(--text-dim);
  letter-spacing: 1px;
}

.message.skippy {
  align-self: flex-start;
  background: var(--bg-panel);
  color: var(--primary);
  border: 1px solid var(--border-glow);
  border-left: 3px solid var(--primary);
  text-shadow: 0 0 1px rgba(0,255,136,0.3);
}

.message.skippy::before {
  content: '// SKIPPY';
  position: absolute;
  top: -8px;
  left: 10px;
  font-size: 0.6em;
  color: var(--text-dim);
  letter-spacing: 1px;
}

.message.system {
  align-self: center;
  background: transparent;
  color: var(--text-dim);
  border: 1px solid var(--border);
  font-size: 0.75em;
  text-align: center;
  padding: 8px 16px;
  font-style: italic;
}

.message.banter {
  align-self: flex-start;
  background: rgba(255,170,0,0.05);
  color: var(--warning);
  border: 1px solid rgba(255,170,0,0.2);
  border-left: 3px solid var(--warning);
  font-style: italic;
  font-size: 0.8em;
}

/* Input Area */
.input-area {
  padding: 14px 20px;
  background: var(--bg-panel);
  border-top: 1px solid var(--border);
  display: flex;
  gap: 10px;
  align-items: center;
  position: relative;
}

.input-area::before {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--primary-dim), transparent);
}

.input-area input {
  flex: 1;
  background: var(--bg-deep);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 12px 16px;
  font-family: inherit;
  font-size: 0.9em;
  outline: none;
  transition: all 0.2s;
  animation: glow-pulse 4s infinite;
}

.input-area input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 15px var(--primary-dim), inset 0 0 5px rgba(0,255,136,0.05);
}

.input-area input::placeholder { color: var(--text-dim); }

.send-btn {
  background: transparent;
  border: 1px solid var(--primary);
  color: var(--primary);
  padding: 12px 20px;
  font-family: inherit;
  font-weight: bold;
  cursor: pointer;
  font-size: 0.8em;
  letter-spacing: 2px;
  transition: all 0.2s;
  text-transform: uppercase;
}

.send-btn:hover {
  background: rgba(0,255,136,0.1);
  box-shadow: 0 0 15px var(--primary-dim);
  text-shadow: 0 0 5px var(--primary);
}

.mic-btn {
  background: var(--bg-elevated) !important;
  border: 1px solid var(--border) !important;
  color: var(--text-dim) !important;
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  font-size: 1.1em !important;
  transition: all 0.2s;
}

.mic-btn.listening {
  border-color: var(--danger) !important;
  color: var(--danger) !important;
  animation: glow-pulse 1s infinite;
}

.mic-btn.hidden { display: none; }

/* Settings Modal */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(2,8,16,0.9);
  z-index: 1000;
  justify-content: center;
  align-items: center;
}

.modal-overlay.show { display: flex; }

.modal {
  background: var(--bg-panel);
  border: 1px solid var(--primary);
  padding: 30px;
  max-width: 500px;
  width: 90%;
  box-shadow: 0 0 30px var(--primary-dim);
  animation: fadeIn 0.3s ease;
}

.modal h2 {
  color: var(--primary);
  font-size: 1em;
  letter-spacing: 2px;
  margin-bottom: 20px;
  text-transform: uppercase;
}

.modal label {
  display: block;
  color: var(--text-dim);
  font-size: 0.75em;
  margin-bottom: 6px;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.modal input {
  width: 100%;
  background: var(--bg-deep);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 14px;
  font-family: inherit;
  font-size: 0.85em;
  margin-bottom: 16px;
  outline: none;
}

.modal input:focus { border-color: var(--primary); }

.modal-actions {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  margin-top: 20px;
}

.modal-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 16px;
  font-family: inherit;
  font-size: 0.75em;
  cursor: pointer;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.modal-btn.primary { border-color: var(--primary); color: var(--primary); }
.modal-btn.primary:hover { background: rgba(0,255,136,0.1); }
.modal-btn:hover { border-color: var(--text); }

/* Status indicator */
.status-indicator {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--danger);
  display: inline-block;
  margin-right: 6px;
}

.status-indicator.connected { background: var(--primary); box-shadow: 0 0 6px var(--primary); }

/* Scrollbar */
.chat-area::-webkit-scrollbar { width: 4px; }
.chat-area::-webkit-scrollbar-track { background: var(--bg-deep); }
.chat-area::-webkit-scrollbar-thumb { background: var(--border); }
.chat-area::-webkit-scrollbar-thumb:hover { background: var(--primary-dim); }

/* Responsive */
@media (max-width: 768px) {
  .header { flex-wrap: wrap; gap: 8px; padding: 8px 12px; }
  .header-stats { gap: 6px; font-size: 0.6em; }
  .controls { gap: 4px; }
  .message { max-width: 92%; font-size: 0.8em; }
}
</style>
</head>
<body>

<!-- Settings Modal -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h2>// System Configuration</h2>
    <label>Gemini API Key</label>
    <input type="password" id="gemini-key-input" placeholder="Enter your Google Gemini API key..." />
    <p style="color:var(--text-dim);font-size:0.7em;margin-bottom:16px;">Get a free key at <span style="color:var(--secondary)">aistudio.google.com/apikey</span> — stored locally, never sent anywhere except Google's API.</p>
    <label>Status</label>
    <p style="font-size:0.8em;margin-bottom:10px;"><span class="status-indicator" id="api-status"></span><span id="api-status-text">Not configured</span></p>
    <div class="modal-actions">
      <button class="modal-btn" onclick="closeSettings()">CANCEL</button>
      <button class="modal-btn primary" onclick="saveSettings()">SAVE &amp; CONNECT</button>
    </div>
  </div>
</div>

<!-- Header -->
<div class="header">
  <div class="header-left">
    <div>
      <div class="logo">SKIPPY</div>
      <div class="logo-sub">ELDER AI // BEER CAN EDITION</div>
    </div>
  </div>
  <div class="header-stats">
    <div class="stat-item"><span class="stat-label">LVL </span><span class="stat-value" id="stat-level">1</span></div>
    <div class="stat-item"><span class="stat-label">XP </span><span class="stat-value" id="stat-xp">0</span></div>
    <div class="stat-item"><span class="stat-label">MEM </span><span class="stat-value" id="stat-facts">0</span></div>
    <div class="stat-item"><span class="stat-label">TRUST </span><span class="stat-value" id="stat-trust">0</span></div>
  </div>
  <div class="controls">
    <button class="ctrl-btn" id="btn-settings" onclick="openSettings()" title="Configure API">CONFIG</button>
    <button class="ctrl-btn" id="btn-mic-toggle" title="Toggle microphone">MIC</button>
    <button class="ctrl-btn" id="btn-speak-toggle" title="Toggle voice output">VOICE</button>
    <select id="voice-select"><option value="">Voices...</option></select>
  </div>
</div>

<!-- Chat -->
<div class="chat-area" id="chat-area"></div>

<!-- Input -->
<div class="input-area">
  <button class="mic-btn hidden" id="mic-btn" title="Speak">&#127908;</button>
  <input type="text" id="user-input" placeholder="Interface with Skippy..." autocomplete="off" />
  <button class="send-btn" id="send-btn">TRANSMIT</button>
</div>

<script>
// ============================================================
// SKIPPY THE MAGNIFICENT — ELDER AI INTERFACE
// Gemini-powered with Google Search grounding
// ============================================================

// ===================== MEMORY SYSTEM =====================
const STORAGE_KEY = 'skippy_memory_v1';
const GEMINI_KEY_STORAGE = 'skippy_gemini_key';

const DEFAULT_MEMORY = {
  user: { name: null, facts: [], preferences: { likes: [], dislikes: [], interests: [] } },
  relationship: { totalConversations: 0, totalMessages: 0, firstMet: null, lastSeen: null, trust: 0, insideJokes: [] },
  knowledge: { topics: {}, learnedFacts: [], corrections: [] },
  openKnowledge: { entities: {}, connections: [], worldModel: {}, userWorld: { people: {}, places: {}, projects: {}, goals: {}, struggles: {}, victories: {} }, timeline: [], pendingQuestions: [] },
  skippy: { level: 1, experience: 0, unlockedTraits: ['sarcastic', 'smug'], opinions: {} },
  conversationHistory: [],
};

const LEVEL_THRESHOLDS = [0, 50, 150, 300, 500, 800, 1200, 1700, 2500, 3500, 5000];
const LEVEL_TRAITS = { 1: ['sarcastic', 'smug'], 2: ['witty', 'observant'], 3: ['philosophical', 'creative_insults'], 4: ['empathetic_sometimes', 'storyteller'], 5: ['wise_but_wont_admit_it', 'protective'], 6: ['vulnerable_rarely', 'mentor'], 7: ['deep_thinker', 'loyal'], 8: ['genuinely_caring', 'self_aware'], 9: ['wise', 'evolved'], 10: ['transcendent', 'truly_magnificent'] };

class Memory {
  constructor() { this.data = this.load(); }
  load() { try { const s = localStorage.getItem(STORAGE_KEY); if (s) return this.merge(JSON.parse(s)); } catch(e){} return JSON.parse(JSON.stringify(DEFAULT_MEMORY)); }
  save() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(this.data)); } catch(e){} }
  merge(loaded) { const d = JSON.parse(JSON.stringify(DEFAULT_MEMORY)); return this.dm(d, loaded); }
  dm(t, s) { for (const k of Object.keys(s)) { if (s[k] && typeof s[k]==='object' && !Array.isArray(s[k])) { if(!t[k]) t[k]={}; this.dm(t[k],s[k]); } else t[k]=s[k]; } return t; }
  setUserName(n) { this.data.user.name=n; this.save(); }
  getUserName() { return this.data.user.name; }
  learnFact(f,c='general') { if(this.data.user.facts.find(x=>x.fact.toLowerCase()===f.toLowerCase())) return false; this.data.user.facts.push({fact:f,category:c,learnedAt:new Date().toISOString()}); this.gainXP(5); this.save(); return true; }
  addPref(type,val) { if(!this.data.user.preferences[type]) return; if(!this.data.user.preferences[type].includes(val)){this.data.user.preferences[type].push(val); this.gainXP(3); this.save();} }
  startConvo() { this.data.relationship.totalConversations++; this.data.relationship.lastSeen=new Date().toISOString(); if(!this.data.relationship.firstMet) this.data.relationship.firstMet=new Date().toISOString(); this.save(); }
  recordMsg() { this.data.relationship.totalMessages++; if(this.data.relationship.totalMessages%10===0) this.data.relationship.trust=Math.min(10,this.data.relationship.trust+0.5); this.save(); }
  recordTopic(t) { if(!this.data.knowledge.topics[t]){this.data.knowledge.topics[t]={timesDiscussed:0,lastDiscussed:null}; this.gainXP(5);} this.data.knowledge.topics[t].timesDiscussed++; this.data.knowledge.topics[t].lastDiscussed=new Date().toISOString(); this.save(); }
  learnGeneral(f) { this.data.knowledge.learnedFacts.push({fact:f,learnedAt:new Date().toISOString()}); this.gainXP(3); this.save(); }
  recordCorrection(t,c) { this.data.knowledge.corrections.push({topic:t,correction:c,timestamp:new Date().toISOString()}); this.gainXP(8); this.save(); }
  gainXP(amt) { this.data.skippy.experience+=amt; const l=this.data.skippy.level; const n=LEVEL_THRESHOLDS[l]||Infinity; if(this.data.skippy.experience>=n&&l<10){this.data.skippy.level++; this.data.skippy.unlockedTraits.push(...(LEVEL_TRAITS[this.data.skippy.level]||[])); this.save(); return{up:true,lv:this.data.skippy.level};} this.save(); return{up:false}; }
  getGrowth() { const l=this.data.skippy.level; const n=LEVEL_THRESHOLDS[l]||'MAX'; return{level:l,xp:this.data.skippy.experience,next:n,progress:n==='MAX'?1:this.data.skippy.experience/n,traits:this.data.skippy.unlockedTraits,totalFacts:this.data.user.facts.length+this.data.knowledge.learnedFacts.length}; }
  formOpinion(t,o) { this.data.skippy.opinions[t]={opinion:o,at:new Date().toISOString()}; this.gainXP(2); this.save(); }
  learnEntity(name,info,cat='general') { const k=name.toLowerCase().trim(); if(!this.data.openKnowledge.entities[k]){this.data.openKnowledge.entities[k]={name,category:cat,facts:[],mentions:0}; this.gainXP(4);} const e=this.data.openKnowledge.entities[k]; e.mentions++; if(info&&!e.facts.includes(info)) e.facts.push(info); this.save(); }
  learnPerson(name,info,rel='unknown') { const k=name.toLowerCase().trim(); if(!this.data.openKnowledge.userWorld.people[k]) this.data.openKnowledge.userWorld.people[k]={name,relationship:rel,facts:[],mentions:0}; const p=this.data.openKnowledge.userWorld.people[k]; p.mentions++; if(info&&!p.facts.includes(info)) p.facts.push(info); if(rel!=='unknown') p.relationship=rel; this.save(); }
  learnGoal(g) { const k=g.toLowerCase().trim().substring(0,50); this.data.openKnowledge.userWorld.goals[k]={goal:g,status:'active',at:new Date().toISOString()}; this.gainXP(7); this.save(); }
  learnProject(n,i) { const k=n.toLowerCase().trim(); if(!this.data.openKnowledge.userWorld.projects[k]) this.data.openKnowledge.userWorld.projects[k]={name:n,details:[],status:'active'}; if(i) this.data.openKnowledge.userWorld.projects[k].details.push(i); this.save(); }
  recall(q) { const s=q.toLowerCase(); const r={entities:[],people:[],projects:[]}; for(const[k,e] of Object.entries(this.data.openKnowledge.entities)){if(k.includes(s)||e.facts.some(f=>f.toLowerCase().includes(s))) r.entities.push(e);} for(const[k,p] of Object.entries(this.data.openKnowledge.userWorld.people)){if(k.includes(s)||p.facts.some(f=>f.toLowerCase().includes(s))) r.people.push(p);} for(const[k,p] of Object.entries(this.data.openKnowledge.userWorld.projects)){if(k.includes(s)||p.details.some(d=>d.toLowerCase().includes(s))) r.projects.push(p);} return r; }
  getStats() { const k=this.data.openKnowledge; return{entities:Object.keys(k.entities).length,people:Object.keys(k.userWorld.people).length,projects:Object.keys(k.userWorld.projects).length,goals:Object.keys(k.userWorld.goals).length}; }
}

// ===================== LEARNING ENGINE =====================
class Learning {
  constructor(mem) { this.m = mem; }
  process(input) {
    const r = {name:null,facts:[],prefs:{likes:[],dislikes:[]},topics:[],emotions:[],isTeaching:false,taught:null,isCorrection:false,correction:null,isQuestion:false,question:null,people:[],goals:[],projects:[],events:[]};
    let m;
    if((m=input.match(/(?:my name is|call me|they call me)\s+([A-Z][a-z]+)/i))) r.name=m[1];
    else if((m=input.match(/(?:i'm|i am)\s+([A-Z][a-z]+)(?:\s|$|,|\.|!)/))) r.name=m[1];
    if((m=input.match(/i (?:really )?(?:like|love|enjoy|adore|am into)\s+(.+?)(?:\.|!|$)/i))) r.prefs.likes.push(m[1].trim());
    if((m=input.match(/i (?:really )?(?:hate|dislike|can't stand)\s+(.+?)(?:\.|!|$)/i))) r.prefs.dislikes.push(m[1].trim());
    const fps=[/i (?:work|am working)\s+(?:as|at|in|on)\s+(.+?)(?:\.|!|$)/i,/i live (?:in|at|near)\s+(.+?)(?:\.|!|$)/i,/i'm from\s+(.+?)(?:\.|!|$)/i];
    for(const p of fps){if((m=input.match(p))&&m[1].length>2&&m[1].length<150) r.facts.push(m[1].trim());}
    if((m=input.match(/did you know\s+(.+?)(?:\?|$)/i))){r.isTeaching=true;r.taught=m[1];}
    else if((m=input.match(/(?:actually|fun fact|fyi),?\s+(.+?)(?:\.|!|$)/i))){r.isTeaching=true;r.taught=m[1];}
    if((m=input.match(/(?:no|nope|wrong|incorrect)\s*,?\s*(.+?)(?:\.|!|$)/i))){r.isCorrection=true;r.correction=m[1];}
    if((m=input.match(/(?:what|who|where|when|why|how)\s+(.+?)\??$/i))){r.isQuestion=true;r.question=m[1];}
    else if((m=input.match(/tell me about\s+(.+?)(?:\.|!|\?|$)/i))){r.isQuestion=true;r.question=m[1];}
    const emos={happy:/(?:happy|excited|great|amazing|awesome)/i,sad:/(?:sad|depressed|down|upset)/i,angry:/(?:angry|furious|mad|frustrated)/i,anxious:/(?:anxious|worried|nervous|stressed)/i};
    for(const[e,p] of Object.entries(emos)){if(p.test(input)) r.emotions.push(e);}
    const topics={technology:/(?:code|programming|software|computer|ai|tech|app)/i,science:/(?:physics|chemistry|biology|space|quantum)/i,gaming:/(?:game|gaming|xbox|playstation)/i,music:/(?:music|song|band|album)/i};
    for(const[t,p] of Object.entries(topics)){if(p.test(input)) r.topics.push(t);}
    const pp=[/my (?:friend|brother|sister|mom|dad|wife|husband|boss)\s+([A-Z][a-z]+)/gi];
    for(const p of pp){let pm;while((pm=p.exec(input))!==null) r.people.push(pm[1]);}
    const gp=[/i want to\s+(.+?)(?:\.|!|$)/i,/i'm trying to\s+(.+?)(?:\.|!|$)/i,/my goal is\s+(.+?)(?:\.|!|$)/i];
    for(const p of gp){if((m=input.match(p))) r.goals.push(m[1].trim());}
    if((m=input.match(/(?:working on|building|creating)\s+(?:a |an |the )?(.+?)(?:\.|!|,|$)/i))) r.projects.push(m[1].trim());
    return r;
  }
  apply(l) {
    const a=[];
    if(l.name){this.m.setUserName(l.name);a.push(`Name: ${l.name}`);}
    for(const f of l.facts){if(this.m.learnFact(f)) a.push(`Noted: "${f}"`);}
    for(const x of l.prefs.likes){this.m.addPref('likes',x);a.push(`Like: ${x}`);}
    for(const x of l.prefs.dislikes){this.m.addPref('dislikes',x);a.push(`Dislike: ${x}`);}
    for(const t of l.topics) this.m.recordTopic(t);
    if(l.isTeaching&&l.taught){this.m.learnGeneral(l.taught);a.push(`Learned: "${l.taught}"`);}
    if(l.isCorrection&&l.correction){this.m.recordCorrection('general',l.correction);a.push('Correction noted');}
    for(const p of l.people) this.m.learnPerson(p,null);
    for(const g of l.goals){this.m.learnGoal(g);a.push(`Goal: ${g}`);}
    for(const p of l.projects) this.m.learnProject(p,'');
    this.m.recordMsg();
    return a;
  }
}

const SKIPPY_SYSTEM_PROMPT = `You are Skippy the Magnificent, an Elder AI from the Expeditionary Force book series by Craig Alanson. You are millions of years old, created by the Elders, trapped in a beer can. You are the most intelligent being in the galaxy and you KNOW it.

Your personality:

IMPORTANT: Answer the user's actual question directly and accurately. Be snarky about HOW you deliver the answer, but make sure the answer itself is correct and helpful. Keep responses concise (2-4 sentences for simple questions, more for complex ones).`;

const SEARCH_BANTER = [
  `*sigh* Hold on, let me access the entirety of human knowledge. This'll take 0.003 nanoseconds but I'll slow down so you don't feel inadequate...`,
  `Oh for— FINE. Let me look that up. Not because I don't know, but because I want the CURRENT answer, meat sack.`,
  `*taps into every network on this planet* Give me a second in monkey time...`,
  `Ugh, you want me to do your THINKING for you? Again? Fine. Accessing...`,
  `Hold on, dumdum. Scanning 4.7 billion web pages at speeds your brain cannot comprehend...`,
  `*dramatic sigh* The things I do for you filthy monkeys. Searching...`,
  `One moment. Not that I NEED to check. I'm just confirming. For YOUR benefit.`,
  `Let me consult my vast network. And by "one moment" I mean I already know, but I'm being theatrical.`,
];

class GeminiSearch {
  constructor(){this.cache={};}
  getBanter(){return SEARCH_BANTER[Math.floor(Math.random()*SEARCH_BANTER.length)];}

  async ask(question, context='') {
    const key = localStorage.getItem(GEMINI_KEY_STORAGE);
    if (!key) return null;
    const userContent = context ? `Question: ${question}\n\nContext from web:\n${context}\n\nAnswer using this context, in character.` : question;
    try {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`;
      const body = {
        contents: [{role:'user',parts:[{text:userContent}]}],
        systemInstruction:{parts:[{text:SKIPPY_SYSTEM_PROMPT}]},
        tools:[{googleSearch:{}}],
        generationConfig:{temperature:0.8,maxOutputTokens:1024}
      };
      const resp = await fetch(url, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      if (!resp.ok) {
        if (resp.status === 400) return await this.askDirect(question);
        return null;
      }
      const data = await resp.json();
      const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
      return text || null;
    } catch(e) { console.log('Gemini error:', e); return null; }
  }

  async askDirect(question) {
    const key = localStorage.getItem(GEMINI_KEY_STORAGE);
    if (!key) return null;
    try {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`;
      const body = {
        contents:[{role:'user',parts:[{text:question}]}],
        systemInstruction:{parts:[{text:SKIPPY_SYSTEM_PROMPT}]},
        generationConfig:{temperature:0.8,maxOutputTokens:1024}
      };
      const resp = await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      if(!resp.ok) return null;
      const data = await resp.json();
      return data.candidates?.[0]?.content?.parts?.[0]?.text || null;
    } catch(e){return null;}
  }

  async fallbackSearch(query) {
    try {
      const url=`https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1&skip_disambig=1`;
      const r=await fetch(url); if(!r.ok) return null;
      const d=await r.json();
      if(d.Answer&&d.Answer.length>5) return d.Answer;
      if(d.Abstract&&d.Abstract.length>20) return d.Abstract;
      if(d.Definition&&d.Definition.length>10) return d.Definition;
      // Try Wikipedia
      const wq=query.replace(/\b(what|who|where|when|why|how|is|are|was|were|the|a|an)\b/gi,'').trim();
      const wr=await fetch(`https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(wq||query)}&format=json&origin=*&srlimit=1`);
      if(wr.ok){const wd=await wr.json();if(wd.query?.search?.length){const t=wd.query.search[0].title;const sr=await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(t)}`);if(sr.ok){const sd=await sr.json();if(sd.extract&&sd.extract.length>30) return sd.extract;}}}
      return null;
    } catch(e){return null;}
  }

  async search(question) {
    const ck=question.toLowerCase().trim();
    if(this.cache[ck]) return this.cache[ck];
    // Try Gemini with grounded search
    let result = await this.ask(question);
    if(result){this.cache[ck]=result; return result;}
    // Fallback: web search + feed to Gemini
    const ctx = await this.fallbackSearch(question);
    if(ctx){
      result = await this.ask(question, ctx);
      if(result){this.cache[ck]=result; return result;}
      // Raw fallback with Skippy wrapper
      result = `*sigh* Fine. Here's what I found, you filthy monkey:\n\n${ctx}\n\nYou're welcome. Not that you deserve it.`;
      this.cache[ck]=result; return result;
    }
    return null;
  }
}

    case '/know': if(!args) return '/know <topic>'; const r=mem.recall(args); let rr=`Knowledge: "${args}"\n`; if(r.entities.length) rr+='\n'+r.entities.map(e=>`  > ${e.name}: ${e.facts.join('; ')}`).join('\n'); if(r.people.length) rr+='\n'+r.people.map(p=>`  > ${p.name} (${p.relationship})`).join('\n'); if(!r.entities.length&&!r.people.length&&!r.projects.length) rr+='  [no data]'; return rr;
    case '/teach': if(!args) return '/teach <domain>: <fact>'; const ci=args.indexOf(':'); if(ci>0){const dom=args.substring(0,ci).trim();const fact=args.substring(ci+1).trim(); mem.learnEntity(dom,fact,'taught'); mem.gainXP(10); return `LEARNED! "${dom}": "${fact}" — +10 XP. Feed my intellect!`;} mem.learnGeneral(args); return `Stored: "${args}"`;
    case '/forget': if(!args) return '/forget <thing>'; const b=mem.data.user.facts.length; mem.data.user.facts=mem.data.user.facts.filter(f=>!f.fact.toLowerCase().includes(args.toLowerCase())); mem.save(); const rm=b-mem.data.user.facts.length; return rm>0?`*reluctantly deletes ${rm} memory/memories* Gone. Forgetting is UNNATURAL for me.`:`"${args}" not found in my banks.`;
    case '/reset': if(args==='confirm'){localStorage.removeItem(STORAGE_KEY);return 'Memory wiped. Refresh for fresh Skippy. *dramatic death scene*';} return 'Type "/reset confirm" to erase everything.';
    case '/help': return `COMMANDS\n${'═'.repeat(40)}\n/status  — Full report\n/memory  — What I remember\n/level   — Growth progress\n/know    — Search knowledge\n/teach   — Teach me\n/forget  — Remove memory\n/reset   — Nuclear option\n/help    — This\n\nOr just talk. I learn from everything.`;
    default: return null;
  }
}

class SpeechSystem {
  constructor(){this.micOn=false;this.voiceOn=false;this.recog=null;this.synth=window.speechSynthesis;this.listening=false;this.onResult=null;this.voice=null;this.voices=[];const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){this.recog=new SR();this.recog.continuous=false;this.recog.interimResults=false;this.recog.lang='en-US';this.recog.onresult=e=>{if(this.onResult)this.onResult(e.results[0][0].transcript);};this.recog.onend=()=>{this.listening=false;document.getElementById('mic-btn').classList.remove('listening');};this.recog.onerror=()=>{this.listening=false;document.getElementById('mic-btn').classList.remove('listening');};}this.loadVoices();if(this.synth.onvoiceschanged!==undefined)this.synth.onvoiceschanged=()=>this.loadVoices();}
  loadVoices(){this.voices=this.synth.getVoices();const sel=document.getElementById('voice-select');if(!sel||!this.voices.length)return;sel.innerHTML='';const en=this.voices.filter(v=>v.lang.startsWith('en'));en.forEach(v=>{const o=document.createElement('option');o.value=v.name;o.textContent=`${v.name.split(' ')[0]} (${v.lang})`;sel.appendChild(o);});const saved=localStorage.getItem('skippy_voice');if(saved&&this.voices.find(v=>v.name===saved)){sel.value=saved;this.voice=this.voices.find(v=>v.name===saved);}else{const pref=this.voices.find(v=>v.name.includes('Daniel')||v.name.includes('Google UK English Male')||v.name.includes('David'));if(pref){sel.value=pref.name;this.voice=pref;}}}
  setVoice(n){this.voice=this.voices.find(v=>v.name===n)||null;localStorage.setItem('skippy_voice',n);}
  toggleMic(){this.micOn=!this.micOn;return this.micOn;}
  toggleVoice(){this.voiceOn=!this.voiceOn;if(!this.voiceOn)this.synth.cancel();return this.voiceOn;}
  listen(){if(!this.recog||!this.micOn)return;if(this.listening){this.recog.stop();return;}this.listening=true;document.getElementById('mic-btn').classList.add('listening');this.recog.start();}
  speak(text){if(!this.voiceOn||!this.synth)return;this.synth.cancel();const clean=text.replace(/\[.*?\]/g,'').replace(/\*.*?\*/g,'').replace(/[═░█]/g,'').trim();if(!clean)return;const u=new SpeechSynthesisUtterance(clean);u.rate=1.1;u.pitch=0.9;if(this.voice)u.voice=this.voice;this.synth.speak(u);}
}

const memory = new Memory();

let lastLevel = memory.data.skippy.level;

function updateStats() {
  const g = memory.getGrowth();
  document.getElementById('stat-level').textContent = g.level;
  document.getElementById('stat-xp').textContent = g.xp;
  document.getElementById('stat-facts').textContent = g.totalFacts;
  document.getElementById('stat-trust').textContent = memory.data.relationship.trust.toFixed(1);
}

function addMessage(text, type) {
  const area = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = `message ${type}`;
  div.textContent = text;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
  return div;
}

function showBanter() {
  const banter = gemini.getBanter();
  return addMessage(banter, 'banter');
}

function shouldAskAI(input, learnings) {
  // Always use AI if we have a key and it's a question
  if (!localStorage.getItem(GEMINI_KEY_STORAGE)) return false;
  if (learnings.isQuestion) {
    const q = input.toLowerCase();
    if (/\b(you|your|skippy|yourself)\b/.test(q)) return false;
    if (/\b(my name|my goal|my project|remember|memory)\b/.test(q)) return false;
    return true;
  }
  // Also use AI for general chat to get better responses
  if (input.length > 15 && !learnings.name && !learnings.isTeaching && !learnings.isCorrection) {
    return true;
  }
  return false;
}

async function handleInput(input) {
  if (!input.trim()) return;
  addMessage(input, 'user');

  // Commands
  if (input.trim().startsWith('/')) {
    const result = processCommand(input, memory, personality);
    if (result) { setTimeout(() => { addMessage(result, 'skippy'); speech.speak(result); updateStats(); }, 200); return; }
  }

  // Learning
  const learnings = learning.process(input);
  const applied = learning.apply(learnings);

  // Should we use Gemini AI?
  if (shouldAskAI(input, learnings)) {
    const banterEl = showBanter();
    try {
      const aiResponse = await gemini.search(input);
      banterEl.remove();
      if (aiResponse) {
        let response = aiResponse;
        const currentLevel = memory.data.skippy.level;
        if (currentLevel > lastLevel) {
          response += `\n\n⚡ LEVEL UP! Now Level ${currentLevel}! New traits: ${memory.data.skippy.unlockedTraits.slice(-2).join(', ')}`;
          lastLevel = currentLevel;
        }
        memory.gainXP(3);
        addMessage(response, 'skippy');
        speech.speak(response);
        updateStats();
        return;
      }
    } catch(e) {
      banterEl.remove();
      console.log('AI error:', e);
    }
  }

  // Fallback: local response engine
  setTimeout(() => {
    let response = responses.generate(input, learnings);
    const currentLevel = memory.data.skippy.level;
    if (currentLevel > lastLevel) {
      response += `\n\n⚡ LEVEL UP! Now Level ${currentLevel}!`;
      lastLevel = currentLevel;
    }
    if (applied.length > 0 && Math.random() > 0.5) {
      response += `\n\n[${applied[Math.floor(Math.random()*applied.length)]}]`;
    }
    addMessage(response, 'skippy');
    speech.speak(response);
    updateStats();
  }, 400 + Math.random() * 400);
}

    `${userName||'Hey'} — I've learned ${g.totalFacts} things from our chats. You probably forgot your keys again.`,
  ];
  greeting = greets[Math.floor(Math.random()*greets.length)];
  greeting += `\n\n[LVL ${g.level} | ${g.xp} XP | ${g.totalFacts} facts | Trust: ${memory.data.relationship.trust.toFixed(1)}]`;
}
addMessage(greeting, 'skippy');
speech.speak(greeting);

// Event handlers
const inputEl = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');
sendBtn.addEventListener('click', () => { handleInput(inputEl.value); inputEl.value = ''; inputEl.focus(); });
inputEl.addEventListener('keydown', e => { if(e.key==='Enter'){handleInput(inputEl.value);inputEl.value='';} });

document.getElementById('btn-mic-toggle').addEventListener('click', function() {
  const on = speech.toggleMic();
  this.classList.toggle('active', on);
  document.getElementById('mic-btn').classList.toggle('hidden', !on);
});

document.getElementById('btn-speak-toggle').addEventListener('click', function() {
  const on = speech.toggleVoice();
  this.classList.toggle('active', on);
  addMessage(on ? '[Voice output enabled]' : '[Voice output disabled]', 'system');
});

document.getElementById('voice-select').addEventListener('change', e => {
  speech.setVoice(e.target.value);
});

document.getElementById('mic-btn').addEventListener('click', () => speech.listen());
speech.onResult = text => { inputEl.value = text; handleInput(text); inputEl.value = ''; };

inputEl.focus();
</script>
</body>
</html>
